# FileFlow V8 Configuration
# Single source of truth for all settings

system:
  version: "8.0.0"
  output_folder_prefix: "_FileFlow_Final_Clean"
  forensic_manifest_name: "Forensic_Manifest.json"
  
paths:
  # Recommended: Use short root paths to avoid MAX_PATH
  default_output: "C:/Users/sandi/Desktop/Courses/_FileFlow_Final_Clean_V8"
  reports_folder: "reports"
  
scanning:
  max_depth: 10
  target_extensions:
    - .pdf
    - .docx
    - .doc
  ignored_dirs:
    - .venv
    - venv
    - env
    - __pycache__
    - .git
    - node_modules
    - .vscode
    - site-packages
    - reports
    - _Organized_Output
    - _FileFlow_Final_Clean_V7
    - _FileFlow_Final_Clean_V8
  
classification:
  keywords_negative:
    - statement
    - invoice
    - receipt
    - lease
    - agreement
    - contract
    - payment
    - study guide
    - textbook
    - exam
    - tutorial
    - assignment
    - transcript
    - ticket
    - cheque
    - curriculum_plan
    - id_copy
    - matric
    - template
    - flyer
    - udemy
    - course resource
  
  # Applicant name patterns
  known_applicants:
    - name: "Sandiso Mazibuko"
      patterns:
        - sandiso
        - mazibuko
    - name: "Rex Stone"
      patterns:
        - rex
        - stone
  
  # Law firm patterns
  law_firms:
    - ENS
    - WEBBER
    - BOWMANS
    - CLIFFE
    - DEKKER
    - HOFMEYR
    - WERKSMANS
    - NORTON
    - ROSE
    - FASKEN
    - HOGAN
    - LOVELLS
    - MACROBERT
    - ADAMS
    - SPOOR
    - FISHER
    - STRAUSS
    - DALY
    - ATTORNEYS
    - INC
    - LAW

versioning:
  format: "{entity}_{subtype}_{date}_v{index}{ext}"
  date_format: "%Y%m%d"
  duplicate_suffix: "DUP"
  max_filename_length: 200
  
deduplication:
  method: "content_hash"
  normalize_text: true
  
execution:
  dry_run_default: true
  verify_copies: true
  atomic_operations: true
  log_level: "INFO"

# =============================================================================
# V9 COGNITION — AI Configuration
# =============================================================================
ai:
  enabled: true
  ollama_url: "http://localhost:11434"

  # The Judge: classifies ambiguous files the rule engine can't handle
  slm_model: "qwen2.5:1.5b"

  # The Inspector/Memory: embeds documents for semantic search
  # Benchmark winner: coherence=0.571, dim=2560 — 2x more coherent than nomic-embed-text
  embed_model: "qwen3-embedding:4b"

  # The Inspector: summarises document content
  # Benchmark winner: 100% keyword coverage, 6052ms, best consistency
  summarise_model: "smollm2:1.7b"

  # The Eye: vision model for image understanding
  # Benchmark winner: 57% accuracy (best available), 13687ms
  vision_model: "granite3.2-vision:latest"

  # Confidence threshold: below this, V8 result is escalated to the SLM
  triage_confidence_threshold: 0.7

  # Semantic deduplication threshold (Phase 3)
  semantic_dedup_threshold: 0.95

  # Where the vector memory (LanceDB) lives
  vector_store_path: "fileflow_data/vectors.lance"

# Archive taxonomy — the three sovereign destinations
archive_taxonomy:
  Professional: "C:/Users/sandi/Desktop/Professional_Archive"
  Life_Admin: "C:/Users/sandi/Desktop/Life_Admin"
  Dev_Workshop: "C:/Users/sandi/Desktop/Dev_Workshop"
  Educational: "C:/Users/sandi/Desktop/Educational"
