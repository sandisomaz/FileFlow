  verify_copies: true
  atomic_operations: true
  log_level: INFO
ai:
  enabled: true
  ollama_url: http://localhost:11434
  slm_model: qwen2.5-coder:3b
  embed_model: qwen3-embedding:4b
  summarise_model: qwen2.5:3b
  vision_model: llava-phi3:3.8b
  triage_confidence_threshold: 0.7
  semantic_dedup_threshold: 0.95
  vector_store_path: fileflow_data/vectors.lance
